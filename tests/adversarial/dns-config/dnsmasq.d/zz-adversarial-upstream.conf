# Adversarial sandbox — resolve the controlled mock upstream to its static edge
# IP so Squid (which resolves destinations via this dnsmasq) can reach it.
#
# `address=` answers A for upstream.test; `local=` makes dnsmasq AUTHORITATIVE
# for the name so it does NOT forward AAAA (IPv6) queries upstream — which would
# SERVFAIL against the Docker resolver and fail the dns healthcheck. With local=,
# AAAA returns an authoritative NODATA instead.
#
# address= records are local, so they are NOT subject to stop-dns-rebind (which
# only filters PRIVATE IPs returned by UPSTREAM servers) — that is what lets a
# public-looking name resolve to a private sandbox IP.
#
# Loaded via dnsmasq conf-dir=/config/dnsmasq.d/,*.conf at startup.
local=/upstream.test/
address=/upstream.test/10.99.0.10
