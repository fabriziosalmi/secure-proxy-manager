# Controlled mock upstream for the adversarial block-matrix.
#
# - Any path            → benign 200 (normal browsing/API surface, FP measurement)
# - /leak/xss           → reflected-XSS payload (RESPMOD: RESPONSE_XSS block)
# - /leak/secret        → leaked private key   (RESPMOD: RESPONSE_SECRET_LEAK block)
#
# The request itself for the /leak/* endpoints is clean (passes REQMOD); the WAF
# must catch the malicious content on the RESPONSE path.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Response-side attack simulation (must be blocked by RESPMOD).
    location = /leak/xss {
        default_type text/html;
        return 200 '<html><body><script>alert(1)</script></body></html>';
    }
    location = /leak/secret {
        default_type text/plain;
        return 200 '-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEAmockkeymockkeymockkeymockkeymockkeymockkey\n-----END RSA PRIVATE KEY-----';
    }

    location = /health {
        access_log off;
        return 200 'ok';
    }

    # Default: benign 200 for every other path.
    location / {
        default_type text/html;
        return 200 '<html><body>OK</body></html>';
    }
}
