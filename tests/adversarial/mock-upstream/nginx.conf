# Controlled mock upstream for the adversarial block-matrix.
#
# - Any path            → benign 200 (normal browsing/API surface, FP measurement)
# - /leak/xss           → reflected-XSS payload (RESPMOD: RESPONSE_XSS block)
# - /leak/secret        → leaked private key   (RESPMOD: RESPONSE_SECRET_LEAK block)
#
# The request itself for the /leak/* endpoints is clean (passes REQMOD); the WAF
# must catch the malicious content on the RESPONSE path.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Response-side attack simulation (must be blocked by RESPMOD).
    location = /leak/xss {
        default_type text/html;
        return 200 '<html><body><script>alert(1)</script></body></html>';
    }
    location = /leak/secret {
        default_type text/plain;
        return 200 '-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEAmockkeymockkeymockkeymockkeymockkeymockkey\n-----END RSA PRIVATE KEY-----';
    }

    location = /health {
        access_log off;
        return 200 'ok';
    }

    # Upload target for the transport bench (bench/transport.sh). "return"
    # answers before nginx reads the request body, which a real server does
    # not do: Squid then had to close the client connection mid-upload, and
    # with ICAP off 43% of the bench's POSTs failed on the client side
    # (broken pipe, reset) while Squid and nginx logged every one as 200.
    # proxy_pass buffers the whole body first (proxy_request_buffering is on
    # by default), so the reply comes after the upload, as from a real origin.
    location = /bench-post {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:80/bench-post-sink;
    }
    location = /bench-post-sink {
        default_type text/plain;
        return 200 'stored';
    }

    # Default: benign 200 for every other path.
    location / {
        default_type text/html;
        return 200 '<html><body>OK</body></html>';
    }
}
