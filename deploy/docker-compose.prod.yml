services:
  web:
    image: ghcr.io/fabriziosalmi/secure-proxy-manager-web:latest
    ports:
      - "80:8011"     # HTTP (redirect + ACME challenges)
      - "443:8443"    # HTTPS (main UI)
      - "8011:8011"   # HTTP alt (backward compat)
      - "8443:8443"   # HTTPS alt (backward compat)
    volumes:
      - letsencrypt:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-120}
      - LETSENCRYPT_DOMAIN=${LETSENCRYPT_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8011/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
      - /etc/nginx/ssl
      - /etc/nginx/conf.d
      - /var/www/certbot
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
    restart: unless-stopped

  waf:
    image: ghcr.io/fabriziosalmi/secure-proxy-manager-waf:latest
    volumes:
      - ./config:/config:ro
      # NOTE: ./data is deliberately NOT mounted here — see the comment in the
      # dev compose. It holds .jwt_secret, .enc_key and the database, and the
      # WAF has no code that reads any of them.
      # Dedicated writable volume for the traffic feature log, matching the dev
      # compose. Previously prod set neither this volume nor WAF_TRAFFIC_LOG_PATH,
      # so the log fell back to the memory-backed /tmp tmpfs (capped at 16MB) and
      # every event-ID forensic record was lost on each restart.
      - waf-traffic:/var/lib/waf
    environment:
      - WAF_TRAFFIC_LOG_PATH=${WAF_TRAFFIC_LOG_PATH:-/var/lib/waf/waf_traffic.jsonl}
      # Service credential for POST /api/internal/alert, scoped to that one
      # route. The WAF used to be handed BASIC_AUTH_USERNAME/PASSWORD — the
      # admin credential — which gave the container that parses
      # attacker-controlled request bodies full control of the management API
      # (SECURE-AUTH-02). If this is empty the backend still accepts admin auth
      # here for upgrade compatibility, but the WAF no longer has it, so alerts
      # are dropped with a log line until the token is set on both services.
      - INTERNAL_ALERT_TOKEN=${INTERNAL_ALERT_TOKEN:-}
      - WAF_BLOCK_THRESHOLD=${WAF_BLOCK_THRESHOLD:-10}
      - WAF_H_ENTROPY=${WAF_H_ENTROPY:-1}
      - WAF_H_ENTROPY_MAX=${WAF_H_ENTROPY_MAX:-7.5}
      - WAF_H_BEACONING=${WAF_H_BEACONING:-1}
      - WAF_H_PII=${WAF_H_PII:-1}
      - WAF_H_SHARDING=${WAF_H_SHARDING:-1}
      - WAF_H_GHOSTING=${WAF_H_GHOSTING:-1}
      - WAF_DISABLED_CATEGORIES=${WAF_DISABLED_CATEGORIES:-}
      - WAF_H_SEQUENCE=${WAF_H_SEQUENCE:-0}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy-internal
    restart: unless-stopped

  backend:
    image: ghcr.io/fabriziosalmi/secure-proxy-manager-backend:latest
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./config:/config
      - ./data:/data
      - ./logs:/logs
    environment:
      - PROXY_HOST=${PROXY_HOST:-proxy}
      - PROXY_PORT=${PROXY_PORT:-3128}
      - PROXY_CONTAINER_NAME=${PROXY_CONTAINER_NAME:-secure-proxy-manager-proxy}
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
      - INTERNAL_ALERT_TOKEN=${INTERNAL_ALERT_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://localhost:8443}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The backend was the only service with a writable root filesystem, and it
    # is also the one documented as running as root — so a process that achieved
    # execution here could modify /server itself and persist across a restart,
    # which is not possible in the four siblings. Its three write targets
    # (/data, /config, /logs) are bind mounts and stay writable (SECURE-OPS-03).
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - proxy-internal
    restart: unless-stopped

  dns:
    image: ghcr.io/fabriziosalmi/secure-proxy-manager-dns:latest
    volumes:
      - ./config:/config:ro
      - ./logs:/var/log
    environment:
      - DNS_UPSTREAM_1=${DNS_UPSTREAM_1:-1.1.1.3}
      - DNS_UPSTREAM_2=${DNS_UPSTREAM_2:-9.9.9.9}
      - DNS_UPSTREAM_3=${DNS_UPSTREAM_3:-8.8.8.8}
      - PROXY_IP=${PROXY_IP:-}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      # Resolve an external name through dnsmasq — exercises upstream forwarding,
      # not just that the daemon is alive.
      test: ["CMD", "nslookup", "-timeout=2", "cloudflare.com", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      # DAC_OVERRIDE: dnsmasq writes its query log to the shared ./logs mount
      # (different UID); with cap_drop: ALL even root needs this to write there.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy-internal
      - frontend
    restart: unless-stopped

  proxy:
    image: ghcr.io/fabriziosalmi/secure-proxy-manager-proxy:latest
    container_name: secure-proxy-manager-proxy
    environment:
      - GUI_IP_WHITELIST=${GUI_IP_WHITELIST:-}
      # Governs Squid's ICAP bypass as well as the WAF's own handler behaviour,
      # so one switch covers both an erroring WAF and an unreachable one
      # (SECURE-REL-02).
      - WAF_FAIL_OPEN=${WAF_FAIL_OPEN:-0}
    ports:
      - "${PROXY_BIND_IP:-0.0.0.0}:3128:3128"
    volumes:
      - ./config:/config
      # NOTE: ./data is deliberately NOT mounted here. Nothing in the proxy
      # image references /data — not startup.sh, generate_squid_conf.sh, the
      # watchdog, squid.conf or the supervisor config — while the directory
      # holds .jwt_secret, .enc_key and the database. Squid is the
      # internet-facing data plane and runs with a broad capability set, so
      # it is the last container that should be able to read them.
      - ./logs:/var/log/squid
      - squid-cache:/var/spool/squid
    depends_on:
      waf:
        condition: service_healthy
      dns:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      # Probes BOTH processes. The watchdog is the only path by which a
      # configuration change reaches Squid, and it used to be invisible: this
      # check tested squid alone, so a dead watchdog left the container
      # reporting healthy while every change silently stopped applying
      # (SECURE-REL-01). The watchdog touches watchdog.heartbeat on every
      # 2s poll, so a stale mtime means it has stopped — a quiet system
      # still writes it, an absent one does not.
      test: ["CMD-SHELL", "((squidclient -h 127.0.0.1 -p 3128 mgr:info 2>/dev/null | grep -q 'Squid Object Cache') || curl -sf --max-time 3 -x http://127.0.0.1:3128 http://www.gstatic.com/generate_204 -o /dev/null) && [ $(( $(date +%s) - $(stat -c %Y /var/log/squid/watchdog.heartbeat 2>/dev/null || echo 0) )) -lt 120 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/log/supervisor
      - /etc/squid
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy-internal
      - frontend
    restart: unless-stopped
    # GUARDRAIL: the proxy intentionally has NO `cap_drop: ALL` — it needs the
    # default caps (CHOWN, SETUID/SETGID, DAC_OVERRIDE) for startup.sh chown +
    # `su - proxy` and squid's privilege drop + log writing to the shared ./logs
    # mount. Adding `cap_drop: ALL` without granting those back breaks the data
    # plane (same class as the 3.10.4/3.10.5 dns CAP_DAC_OVERRIDE bug, threefold).
    cap_add:
      - NET_ADMIN

  tailscale:
    image: tailscale/tailscale:v1.80.3@sha256:af6026ed3e5892c5d4966962618a09685198111507df16803b2aec7066046582
    hostname: ${TAILSCALE_HOSTNAME:-secure-proxy}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-tags=tag:proxy
    volumes:
      - tailscale-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - proxy-internal
    restart: unless-stopped
    profiles:
      - tailscale

  # Observability stack (opt-in)
  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    container_name: secure-proxy-manager-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - proxy-internal
      - frontend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    container_name: secure-proxy-manager-grafana
    # Grafana refuses to start without an explicit admin password. This file is
    # what install.sh deploys, and it defaulted GF_SECURITY_ADMIN_PASSWORD to
    # the literal string "admin" — in a project whose backend refuses to boot
    # when BASIC_AUTH_PASSWORD is "admin". The dashboard displays the same proxy
    # data (SECURE-CONF-05).
    #
    # The check is an entrypoint guard, not a `${VAR:?}` interpolation: compose
    # resolves interpolation for the WHOLE file before it looks at profiles, so
    # `:?` would make every compose command fail for everyone who never enables
    # observability. This fires when the service is actually started.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_ADMIN_PASSWORD is not set. Refusing to start Grafana with the default admin/admin credential — set it in .env (openssl rand -base64 24)." >&2
          exit 1
        fi
        exec /run.sh
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles:
      - observability

networks:
  frontend:
    driver: bridge
  proxy-internal:
    driver: bridge
    internal: true

volumes:
  squid-cache:
    driver: local
  waf-traffic:
    driver: local
  tailscale-data:
    driver: local
  letsencrypt:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
