  # rebuilds for a Go patch release usually follow within weeks.
  - id: CVE-2026-78667
    statement: "Go stdlib < 1.26.9 / 1.27.2 in grafana 13.2.4, k6 2.3.0, prometheus v3.15.0, tailscale v1.102.5; no tag built with the fixed Go yet."
