# Advisories Trivy must not fail the compose-image scan on.
#
# ONLY for a vulnerability in a THIRD-PARTY image where the only remedy in our
# hands — moving to a newer tag — has already been taken. Everything below is
# upstream's to rebuild: a Go module vendored inside Grafana's own binary, or
# an Alpine package whose fixed build has not been published in the image yet.
#
# Every entry carries an expiry. When it lapses the scan goes red again and the
# image gets looked at, which is the point: an ignore without an expiry is how
# a known vulnerability becomes permanent furniture. This is the same bargain
# as scripts/npm-audit-allowlist.json, which is deliberately empty.
#
# Recorded 2026-09-30, after the bump that took these four images from 340
# fixable HIGH/CRITICAL findings to 9.
vulnerabilities:
  # grafana/grafana:13.2.4 — vendored Go modules inside the Grafana binary.
  # Fixing them means Grafana shipping a release built against the patched
  # module; there is no tag available to us that does.
  - id: CVE-2026-84445
    statement: "google.golang.org/grpc v1.83.1 vendored in grafana/grafana:13.2.4; no Grafana release carries the patched module yet."
    expired_at: 2026-12-31
  - id: CVE-2026-84304
    statement: "google.golang.org/grpc v1.83.0 vendored in grafana/grafana:13.2.4; same, upstream rebuild required."
    expired_at: 2026-12-31
  - id: CVE-2026-21728
    statement: "github.com/grafana/tempo vendored in grafana/grafana:13.2.4; Grafana pins a pre-release of it, so no tag of ours fixes this."
    expired_at: 2026-12-31
  - id: CVE-2026-28377
    statement: "github.com/grafana/tempo vendored in grafana/grafana:13.2.4; same."
    expired_at: 2026-12-31
  - id: CVE-2026-111943
    statement: "Go stdlib crypto/x509 (fixed in 1.26.10 / 1.27.3) inside grafana/grafana:13.2.4's own binary and its bundled plugins, built with 1.26.6-1.27.1; 13.2.4 is the newest tag. Recorded 2026-10-24: it was the only finding of the image scan and it red-gated every dependency PR. Our own images move to 1.27.3 in the same change."
    expired_at: 2026-11-30
  # curl in third-party Alpine images, published 2026-10-26: Alpine 3.24 has the
  # fixed 8.23.0-r0, the images below still ship 8.22.0-r0 and no newer tag or
  # digest carries it yet. Our own web image upgrades the package itself
  # (ui/Dockerfile). nginx:1.31.8-alpine is used only by the test and
  # adversarial stacks.
  - id: CVE-2026-92392
    statement: "curl/libcurl 8.22.0-r0 in grafana/grafana:13.2.4 and nginx:1.31.8-alpine (test stacks only); Alpine 3.24 has 8.23.0-r0, no image rebuild published yet. Recorded 2026-10-26."
    expired_at: 2026-11-15
