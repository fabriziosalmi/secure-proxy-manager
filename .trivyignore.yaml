# Advisories Trivy must not fail the compose-image scan on.
#
# ONLY for a vulnerability in a THIRD-PARTY image where the only remedy in our
# hands — moving to a newer tag — has already been taken. Everything below is
# upstream's to rebuild: a Go module vendored inside a binary the image ships, or
# an Alpine package whose fixed build has not been published in the image yet.
#
# Every entry carries an expiry. When it lapses the scan goes red again and the
# image gets looked at, which is the point: an ignore without an expiry is how
# a known vulnerability becomes permanent furniture. This is the same bargain
# as scripts/npm-audit-allowlist.json, which is deliberately empty.
#
# Recorded 2026-09-30, after the bump that took these four images from 340
# fixable HIGH/CRITICAL findings to 9.
vulnerabilities:
  # grafana/grafana:13.3.0: Grafana's own binary scans clean. What is left
  # sits in the datasource plugins the image bundles (tempo, loki, jaeger,
  # mysql, mssql, postgresql, influxdb, cloudwatch, opentsdb, pyroscope),
  # built with Go 1.26.7 and golang.org/x/net 0.58.0/0.59.0. 13.3.0
  # (2026-10-27) is the newest tag; fixing these needs Grafana to rebuild the
  # plugins. Recorded 2026-10-28, when the move from 13.2.4 retired the grpc,
  # kin-openapi and go-jose findings of the Grafana binary.
  - id: CVE-2026-21728
    statement: "github.com/grafana/tempo pre-release v1.5.1-0.20260910130453 in the tempo datasource plugin bundled with grafana/grafana:13.3.0; Grafana pins a pre-release of it, so no tag of ours fixes this."
    expired_at: 2026-12-31
  - id: CVE-2026-28377
    statement: "github.com/grafana/tempo in the tempo datasource plugin bundled with grafana/grafana:13.3.0; same."
    expired_at: 2026-12-31
  # grafana/k6:2.3.0 — Alpine packages whose fixed build k6 has not published
  # in the image yet. Test-only (the bench plane). Carried here rather than
  # left out of the scan: 0.55.0 had 69 findings, and excluding the image was
  # the reason it went unnoticed.
  - id: CVE-2026-107891
    statement: "musl 1.2.6-r2 (musl and musl-utils) in grafana/k6:2.3.0, the newest tag, checked on Docker Hub 2026-11-11; fixed in 1.2.6-r3, pending an upstream rebuild. Recorded 2026-11-11."
    expired_at: 2026-12-31
  - id: CVE-2026-85091
    statement: "zlib 1.3.2-r0 in grafana/k6:2.3.0, the newest tag; fixed in 1.3.2-r1, pending an upstream rebuild. Recorded 2026-11-11."
    expired_at: 2026-12-31
  - id: CVE-2026-14456
    statement: "libcrypto3/libssl3 3.5.7-r0 in grafana/k6:2.3.0; fixed in 3.5.8-r0, pending an upstream rebuild."
    expired_at: 2026-12-31

  # CVE-2026-78661, golang.org/x/net/html < 0.62.0. The scan of 2026-11-25
  # still finds it in prom/prometheus:v3.16.0 (x/net 0.61.0) and
  # tailscale/tailscale:v1.104.7, the newest tags on Docker Hub that day.
  # Scoped to those binaries by path, so it cannot hide the same CVE in any
  # other image, Grafana's included. The images this project builds use
  # x/net 0.62.0 and are scanned at release with no ignore file.
  - id: CVE-2026-78661
    paths:
      - "bin/prometheus"
      - "bin/promtool"
      - "usr/local/bin/containerboot"
      - "usr/local/bin/tailscale"
      - "usr/local/bin/tailscaled"
    statement: "golang.org/x/net/html < 0.62.0 in prom/prometheus:v3.16.0 (prometheus, promtool) and tailscale/tailscale:v1.104.7 (containerboot, tailscale, tailscaled), the newest tags on Docker Hub on 2026-11-25; upstream rebuild required. Recorded 2026-11-25."
    expired_at: 2026-12-25
  # CVE-2026-97054 (GO-2026-6859), Go net/http: an HTTP/1 server can crash
  # through a race in MaxBytesReader; fixed in Go 1.26.11 / 1.27.4. Recorded
  # 2026-11-20 when the CI scan of grafana 13.3.1, prometheus v3.16.0 and k6
  # 2.4.0 (the newest tags on Docker Hub that day) still found it in 18
  # binaries built with Go 1.27.3 (one with 1.26.7); tailscale v1.104.7 scans
  # clean and moved. Scoped to those binaries by path, so it cannot hide the
  # same CVE anywhere else. Short expiry: a Go patch rebuild usually follows
  # within weeks. The images this project builds use Go 1.27.4 and are
  # scanned at release with no ignore file.
  - id: CVE-2026-97054
    paths:
      - "bin/prometheus"
      - "bin/promtool"
      - "usr/bin/k6"
      - "usr/share/grafana/bin/grafana"
      - "usr/share/grafana/data/plugins-bundled/cloudwatch/gpx_grafana_cloudwatch_datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/elasticsearch/gpx_grafana_elasticsearch_datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/grafana-postgresql-datasource/gpx_grafana_postgresql_datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/grafana-pyroscope-datasource/gpx_grafana-pyroscope-datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/influxdb/gpx_grafana_influxdb_datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/jaeger/gpx_grafana-jaeger-datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/loki/gpx_grafana-loki-datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/mssql/gpx_grafana-mssql-datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/mysql/gpx_grafana-mysql-datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/opentsdb/gpx_grafana-opentsdb-datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/prometheus/gpx_grafana-prometheus-datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/stackdriver/gpx_grafana_cloudmonitoring_datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/tempo/gpx_grafana-tempo-datasource_linux_amd64"
      - "usr/share/grafana/data/plugins-bundled/zipkin/gpx_grafana-zipkin-datasource_linux_amd64"
    statement: "Go stdlib < 1.26.11 / 1.27.4 in grafana/grafana:13.3.1 (grafana binary and 14 bundled datasource plugins), prom/prometheus:v3.16.0 (prometheus, promtool) and grafana/k6:2.4.0 (k6), the newest tags on Docker Hub on 2026-11-20; upstream rebuild required. Recorded 2026-11-20."
    expired_at: 2026-12-04
