global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:5000

  - job_name: waf
    metrics_path: /metrics
    static_configs:
      - targets:
          - waf:8080
