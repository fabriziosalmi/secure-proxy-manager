[program:squid]
command=/usr/sbin/squid -N -d 1
autostart=true
autorestart=true
# Unlimited retries. With a finite count supervisord marks the program FATAL
# and stops trying, but supervisord ITSELF keeps running — so PID 1 never
# exits, `restart: unless-stopped` never fires, and nothing recovers the
# container. A transient failure became permanent (SECURE-REL-01).
startretries=1000000
redirect_stderr=true
stdout_logfile=/var/log/supervisor/squid.log
user=root
priority=1

[program:blacklist_watchdog]
command=/usr/bin/python3 /usr/local/bin/blacklist_watchdog.py
autostart=true
autorestart=true
# Same reasoning as squid, and it matters MORE here: the container healthcheck
# probes squid, so a dead watchdog leaves a container reporting healthy while
# every configuration change silently stops reaching the proxy (SECURE-REL-01).
startretries=1000000
redirect_stderr=true
stdout_logfile=/var/log/squid/watchdog.log
stdout_logfile_maxbytes=1MB
user=root
priority=2