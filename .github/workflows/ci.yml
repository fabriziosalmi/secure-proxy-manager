name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required before a merge queue can be enabled on main. GitHub's own wording:
  # "You must use the merge_group event to trigger your GitHub Actions workflow
  # when a pull request is added to a merge queue. Otherwise, status checks will
  # not be triggered when you add a pull request to a merge queue. The merge
  # will fail as the required status check will not be reported."
  #
  # So this lands FIRST, on its own. Turning the queue on before it would leave
  # every pull request waiting forever for the required checks (.github/branch-protection.json) that never run.
  merge_group:
  # Daily, because two of the gates here answer a question whose answer changes
  # WITHOUT a commit: npm audit, govulncheck and Trivy read advisory databases
  # that are updated upstream, so unchanged code can turn insecure overnight.
  #
  # And because main was not being evaluated at all. Dependabot's auto-merge
  # pushes with GITHUB_TOKEN, and a push made with that token does not trigger
  # workflows: commits landed on 2026-09-21 and 2026-09-28 with the last run on
  # main dated 2026-09-19. In that window four HIGH npm advisories appeared and
  # nothing reported them — the branch looked green because nothing ran.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. TypeScript build ──────────────────────────────────────────────────
  build-ui:
    name: UI TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24 (LTS), not 20: vitest 5, jsdom 30 and jest-dom 7 all declare
          # node >= 22, and jsdom is stricter still (^22.22.2 || ^24.15.0 ||
          # >=26.0.0). Note that 25 satisfies none of those ranges, so the
          # version the UI image builds with is deliberately not mirrored here.
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm test
        working-directory: ui

  # ── 1b. Version sync ──────────────────────────────────────────────────
  # Fail the build if the version drifts across version.go / package.json /
  # package-lock.json / CHANGELOG (package-lock lagged at 3.10.2 until 3.10.5).
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-version-sync.sh
      # SECURE-QUAL-05: the WAF heuristic key list is maintained in seven places
      # and had already drifted. Same treatment as version drift.
      - run: bash scripts/check-waf-keys.sh
      # The tailscale image is pinned twice: overlay/tailscale/Dockerfile, which
      # Dependabot updates, and deploy/docker-compose.prod.yml, which it cannot
      # see. They had drifted twenty-two minor versions apart — 122 fixable
      # HIGH/CRITICAL findings in the image an operator deploys against 5 in the
      # one a developer builds.
      - run: bash scripts/check-image-pins.sh
      # No em or en dashes in the UI source, docs/ or any Markdown file. The UI
      # used a bare em dash as the placeholder for a missing value, which reads
      # like a value and does not say what is missing.
      - run: bash scripts/check-no-dashes.sh

  # ── 2. Go backend build ────────────────────────────────────────────────
  build-backend:
    name: Go backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # go-toolchain: images
          # Without this setup-go serves the runner's cached patch release, which
          # can lag the images by a security release (the nightly scanned 1.26.9
          # while 1.26.10 was out).
          check-latest: true
          cache-dependency-path: backend-go/go.sum
      - run: go build -v ./...
        working-directory: backend-go
      - run: go vet ./...
        working-directory: backend-go

  # ── 3. Go WAF build ───────────────────────────────────────────────────
  build-waf:
    name: Go WAF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # go-toolchain: images
          # Without this setup-go serves the runner's cached patch release, which
          # can lag the images by a security release (the nightly scanned 1.26.9
          # while 1.26.10 was out).
          check-latest: true
          cache-dependency-path: waf-go/go.sum
      - run: go build -v ./...
        working-directory: waf-go
      - run: go vet ./...
        working-directory: waf-go

  # ── 4. Go backend tests ──────────────────────────────────────────────
  test-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # go-toolchain: images
          # Without this setup-go serves the runner's cached patch release, which
          # can lag the images by a security release (the nightly scanned 1.26.9
          # while 1.26.10 was out).
          check-latest: true
          cache-dependency-path: backend-go/go.sum
      - run: go test -v -race -count=1 -coverprofile=coverage.out ./...
        working-directory: backend-go
      - name: Check coverage threshold
        working-directory: backend-go
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Backend coverage: ${COVERAGE}%"
          # Fail if coverage drops below 60%
          awk "BEGIN {exit ($COVERAGE < 60) ? 1 : 0}"

  # ── 5. Go WAF tests ───────────────────────────────────────────────────
  test-waf:
    name: WAF unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # go-toolchain: images
          # Without this setup-go serves the runner's cached patch release, which
          # can lag the images by a security release (the nightly scanned 1.26.9
          # while 1.26.10 was out).
          check-latest: true
          cache-dependency-path: waf-go/go.sum
      - run: go test -v -race -count=1 -coverprofile=coverage.out ./...
        working-directory: waf-go
      # SECURE-TEST-03. The WAF is the component that parses attacker-controlled
      # bodies and it had no coverage floor at all, so its ~75% could have
      # fallen to zero without failing a build. Set just under the measured
      # value so it binds immediately; ratchet up as coverage improves.
      - name: Check WAF coverage threshold
        working-directory: waf-go
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "WAF coverage: ${COVERAGE}%"
          awk "BEGIN {exit ($COVERAGE < 70) ? 1 : 0}"

  # ── 5b. Go lint (golangci-lint) ───────────────────────────────────────
  # SECURE-QUAL-01. Before this job the tree carried 86 //nolint:errcheck
  # directives while nothing that reads them ever ran: the only Go static
  # analysis was `go vet` plus a gosec invocation that excluded G104, the
  # unhandled-error rule. The suppressions therefore suppressed nothing.
  lint-go:
    name: Go lint (golangci-lint)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend-go, waf-go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint v2.12.2 and gosec v2.22.4 are built with Go 1.26 and cannot
          # type-check Go 1.27 source ('file requires newer Go version go1.27'); a
          # newer gosec also reports new taint findings that need triage. Move this
          # with the tools, not with the images.
          go-version: "1.26" # go-toolchain: tools
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --timeout 5m

  # ── 5c. Shell lint (shellcheck) ───────────────────────────────────────
  # SECURE-TEST-01. 3,387 lines of shell carry the data plane, including the
  # 633-line generate_squid_conf.sh that is the sole producer of squid.conf,
  # and nothing verified any of it. This is the layer with the worst regression
  # history in the project (the 3.10.3-3.10.5 dns failures, the egress
  # deny-rule anchor drift) and it had the least verification.
  lint-shell:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint the shell that builds the data plane
        run: shellcheck --severity=warning proxy/*.sh deploy/*.sh scripts/*.sh tests/*.sh tests/shell/*.sh
      - name: Local CI lock, worktree guard and non-interactive suites
        run: bash tests/shell/local_ci_lock_test.sh
      # The /config filenames are a contract across three languages and nothing
      # compared the copies: rename one on the Go side and both proxy-side
      # copiers keep looking for the old name, silently, in the enforcement path
      # (SECURE-ARCH-02).
      - name: Check the /config filename contract
        run: bash scripts/check-config-contract.sh

  # ── 5c-bis. Python lint ───────────────────────────────────────────────
  # Go is gated by golangci-lint and Shell by shellcheck; Python was gated by
  # nothing, and it is not a peripheral language here — proxy/blacklist_watchdog.py
  # is the sidecar that applies every blacklist change and every config reload to
  # Squid, and it holds the repository's third most complex function
  # (SECURE-QUAL-03).
  lint-python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ruff
        run: pipx install ruff==0.14.2
      - name: Lint the sidecar that applies configuration to Squid
        run: ruff check proxy/ mcp/

  # ── 5c-ter. Python unit tests ─────────────────────────────────────────
  # The watchdog had no test of any kind: its happy path was covered only
  # transitively by the compose-up e2e, and the branches that decide whether a
  # failed reload is retried, reported or dropped had never run (SECURE-TEST-02).
  test-python:
    name: Python tests (watchdog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pytest
        run: pipx install pytest==8.4.2
      # The MCP server's tests import it; the bounds are mcp/pyproject.toml's.
      # Without these they skip (importorskip) instead of running.
      - name: Install the MCP server's dependencies into the pytest env
        run: pipx inject pytest 'mcp>=2.0.0,<3.0.0' 'httpx>=0.27,<1.0.0'
      - name: Test the sidecar's failure branches
        run: sudo mkdir -p /config && sudo chmod 777 /config && pytest tests/python -q

  # ── 5c-quater. Restore drill ──────────────────────────────────────────
  # scripts/restore.sh is what an operator runs during an incident and nothing
  # had ever run it, so its one design property — verify the archive BEFORE
  # replacing the live database — was unestablished at the moment it matters
  # (SECURE-DATA-02).
  test-restore:
    name: Restore drill (backup verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
      - name: Refuse a corrupt backup, keep the live data
        run: bash tests/shell/restore_test.sh

  # ── 5d. Squid config generation (fixture tests) ───────────────────────
  # SECURE-TEST-01, second half. shellcheck catches shape; this catches
  # behaviour. It runs the real generator inside the real proxy image against
  # fixture /config states and asserts on the squid.conf produced — including
  # that squid itself parses it, that the egress fail-closed rule lands exactly
  # once, and that a hostile /config cannot become squid configuration.
  #
  # Writing it immediately found a live bug: the generator exited 1 whenever
  # /config/dst_allow_domain.txt was absent (the normal case), because the
  # final `[ -f ... ] && cp` short-circuit became the exit status.
  test-squid-config:
    name: Squid config generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate squid.conf against fixture /config states
        run: bash tests/shell/generate_squid_conf_test.sh
      # The text assertions above cannot see rule ORDER, and the access policy
      # was wrong by order three times over: destination-only allows ahead of
      # any source check (an open relay into the LAN for any address), and
      # proxy auth, time restrictions and content filtering written after
      # "deny all". This runs real Squid against clients on an external, a LAN
      # and a public network and asserts the status of each request.
      - name: Access policy behaviour (real Squid, three networks)
        run: bash tests/shell/squid_acl_matrix_test.sh
      # The backend and the proxy entrypoint together, sharing /config: an
      # install with proxy login on and no credentials refuses every client
      # and says so, credentials saved through the API reach the proxy, and
      # turning login off removes them. Reuses the images the matrix built.
      - name: Proxy login end to end (backend and proxy, upgrade state)
        run: bash tests/shell/proxy_login_upgrade_test.sh

  # ── 5e. Observability profile (Prometheus + Grafana) ──────────────────
  # Starts the optional observability profile against infra/ and verifies that
  # Prometheus loads its configuration and alert rules and that Grafana
  # provisions the Prometheus datasource.
  observability:
    name: Observability profile (Prometheus + Grafana)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start observability profile and verify Prometheus and Grafana
        run: bash tests/shell/observability_profile_test.sh

  # ── 6. Security scanning (gosec) ─────────────────────────────────────
  security-scan:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint v2.12.2 and gosec v2.22.4 are built with Go 1.26 and cannot
          # type-check Go 1.27 source ('file requires newer Go version go1.27'); a
          # newer gosec also reports new taint findings that need triage. Move this
          # with the tools, not with the images.
          go-version: "1.26" # go-toolchain: tools
          cache-dependency-path: backend-go/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4

      # G104 (unhandled errors) is NO LONGER excluded: golangci-lint's errcheck
      # now covers it in the lint job with an explicit, justified exclusion list,
      # so the rule no longer needs to be switched off wholesale (SECURE-QUAL-01).
      - name: Run gosec on backend-go
        working-directory: backend-go
        run: gosec -severity medium -confidence medium ./...

      - name: Run gosec on waf-go
        working-directory: waf-go
        run: gosec -severity medium -confidence medium -exclude=G114,G301,G302,G304 ./...

      # govulncheck complements gosec (a SAST linter) with the Go vulnerability
      # database: it flags known-CVE dependencies AND stdlib issues, but only when
      # the vulnerable symbol is actually reachable. Reported (continue-on-error)
      # rather than gated, because stdlib advisories track the Go toolchain patch
      # level and would otherwise red-fail unrelated PRs on every disclosure until
      # the toolchain is bumped (handled by the github-actions/gomod Dependabot).
      #
      # It runs on the toolchain the IMAGES are built with, not the 1.26 the
      # linters above need: govulncheck reports the stdlib of the go binary on
      # PATH, so on the tools toolchain it described a Go nobody ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # go-toolchain: images
          check-latest: true
          cache: false
      # v1.1.4 panicked on the 1.27 toolchain ("unexpected expr:
      # *ast.KeyValueExpr") and continue-on-error turned the crash into a green
      # step: the scan did not run and nothing said so.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Exit 3 is "vulnerabilities found": reported, not gated, for the reason
      # above. Any other non-zero exit means the tool itself failed, and that
      # fails the step instead of passing for a scan that never happened.
      - name: Run govulncheck on backend-go and waf-go
        run: |
          rc=0
          for m in backend-go waf-go; do
            echo "── $m"
            (cd "$m" && govulncheck ./...) && r=0 || r=$?
            case "$r" in
              0) ;;
              3) echo "::warning title=govulncheck ($m)::known vulnerabilities reachable, see the log" ;;
              *) echo "::error title=govulncheck ($m)::govulncheck failed with exit $r"; rc=1 ;;
            esac
          done
          exit "$rc"

      - name: npm audit (UI)
        working-directory: ui
        run: |
          npm ci
          # Gate on HIGH/CRITICAL via an allowlisting wrapper. Plain
          # `npm audit --audit-level=high` has no ignore mechanism, so one
          # non-applicable or dev-only HIGH advisory red-gates every unrelated
          # PR. The wrapper fails on HIGH/CRITICAL EXCEPT advisories explicitly
          # justified in scripts/npm-audit-allowlist.json, and prints those it
          # ignores on every run. Moderate stays ungated.
          node ../scripts/npm-audit-gate.mjs

  # ── 6a-bis. Licence inventory ─────────────────────────────────────────
  # The product ships as five container images, so every transitive dependency
  # is REDISTRIBUTED rather than merely linked at the user's site — the case
  # where licence obligations actually bite. Nothing checked them: CVEs were
  # gated, npm audit severity was gated, the WAF heuristic key set was gated,
  # and licences were the one supply-chain property with no check at all
  # (SECURE-DEP-02). The allowlist is permissive-only; a copyleft package
  # entering through a grouped Dependabot update now fails here instead of
  # arriving unnoticed.
  licences:
    name: Licence inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # go-toolchain: images
          # Without this setup-go serves the runner's cached patch release, which
          # can lag the images by a security release (the nightly scanned 1.26.9
          # while 1.26.10 was out).
          check-latest: true
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check Go module licences (both modules)
        run: |
          ALLOWED="Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0"
          # Ignored, with the reason, rather than by widening ALLOWED:
          #  - this project's own packages: the LICENSE is at the repository
          #    root and the modules are subdirectories, so go-licenses cannot
          #    locate it and reports every internal package as Unknown.
          #  - modernc.org/mathutil: ships a LICENSE whose text IS the standard
          #    three-clause BSD (both redistribution clauses and the
          #    "Neither the name" clause are present, checked by hand) but
          #    carries no SPDX identifier, so the classifier returns Unknown.
          IGNORE="github.com/fabriziosalmi/secure-proxy-manager,secure-proxy-waf,modernc.org/mathutil"
          for m in backend-go waf-go; do
            echo "── $m ──"
            (cd "$m" && go-licenses check ./... --allowed_licenses="$ALLOWED" --ignore="$IGNORE")
          done
      - name: Check npm licences (runtime dependencies)
        working-directory: ui
        run: |
          npm ci
          # --excludePrivatePackages skips this repository's own UI package,
          # which is "private": true and UNLICENSED by design; pinning it by
          # name@version would break on every release.
          npx --yes license-checker-rseidelsohn@4.4.2 \
            --production --summary --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;BlueOak-1.0.0;Python-2.0;MIT AND ISC"

  # ── 6b. Trivy filesystem CVE + misconfiguration scan ──────────────────
  # Catches vulnerable OS/library packages and IaC misconfigurations that gosec
  # (Go SAST) and npm audit (JS deps) do not. Installed as a pinned binary
  # rather than an unpinned action, matching this repo's supply-chain posture.
  # Gates only on FIXABLE high/critical findings (--ignore-unfixed) to stay
  # actionable.
  trivy-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        run: |
          # Download the pinned release binary directly — the upstream install.sh
          # is flaky in CI (exits 1 after resolving the version).
          VER=0.69.3
          # sha256 from trivy_0.69.3_checksums.txt, checked against the
          # downloaded file on 2026-10-24. The scanner that gates every merge
          # was run from an unverified download.
          SHA256=1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          echo "${SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan dependencies for fixable high/critical CVEs
        run: |
          trivy fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress .
      # The filesystem scan above reads lockfiles and Dockerfiles. It does NOT
      # pull the third-party images the compose files pin — grafana, prometheus,
      # nginx — so nothing was looking at them, and Dependabot cannot either:
      # its docker ecosystem reads Dockerfiles and Kubernetes YAML, not compose.
      # They carried 271 fixable HIGH/CRITICAL findings between them until the
      # bump that landed with this job.
      #
      # The list is derived from the compose files rather than written out here,
      # so a future bump cannot leave this job scanning a version nobody runs.
      # That is how tailscale was found: it was pinned in the production compose
      # at a version twenty-two minors behind the Dockerfile, and it was not on
      # the list anyone would have typed.
      - name: Scan the images the compose files pin
        run: |
          set -euo pipefail
          imgs=$(grep -hoE '^[[:space:]]+image:[[:space:]]+[^[:space:]]+' \
                   docker-compose.yml docker-compose.test.yml \
                   deploy/docker-compose.prod.yml \
                   tests/adversarial/docker-compose.adversarial.yml \
                 | awk '{print $2}' | grep -v 'secure-proxy-manager' | sort -u)
          echo "$imgs" | sed 's/^/  /'
          rc=0
          for img in $imgs; do
            echo "── $img"
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore.yaml --exit-code 1 --no-progress "$img" || rc=1
          done
          exit $rc
      - name: Report IaC misconfigurations (non-gating)
        run: |
          trivy fs --scanners misconfig \
            --severity HIGH,CRITICAL --exit-code 0 --no-progress .

  # ── 7. Docker build verification ──────────────────────────────────────
  docker-build:
    name: Docker build (all images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build all images
        run: docker compose build web backend waf proxy dns
      # The web container exited on every start when LETSENCRYPT_DOMAIN was
      # set: certbot is not in the image and the self-signed fallback never
      # ran. This starts it under the compose runtime flags in each TLS mode.
      - name: Web container starts with a certificate in every TLS mode
        run: bash tests/shell/ui_tls_entrypoint_test.sh

  # ── 8. Popular list URL health check ──────────────────────────────────
  check-urls:
    name: Verify popular list URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check all popular list URLs return 200
        run: |
          set -e
          FAILED=0
          check_url() {
            local name="$1" url="$2"
            local code
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 25 \
              -H "User-Agent: SecureProxyManager/CI" "$url")
            if [ "$code" = "200" ]; then
              echo "OK   [$code] $name"
            else
              echo "FAIL [$code] $name — $url"
              FAILED=1
            fi
          }
          # Every URL the UI offers in Popular Lists and every auto-refresh
          # default, read from the source rather than listed here: four
          # hand-picked URLs passed while HaGeZi answered 404 and Talos 403,
          # and the UI kept offering them.
          urls=$( { grep -oE "url: 'https://[^']+'" ui/src/components/blacklists/popularLists.ts | sed -E "s/^url: '//; s/'$//";
                    grep -oE '"https://[^"]+"' backend-go/internal/workers/blacklist_refresh.go | tr -d '"'; } | sort -u)
          [ -n "$urls" ] || { echo "no list URLs found in the sources"; exit 1; }
          for url in $urls; do check_url "$url" "$url"; done
          [ "$FAILED" -ne 0 ] && exit 1 || true

  # ── 8b. Compose validation (incl. the prod file users actually run) ───
  # deploy/docker-compose.prod.yml is what deploy/install.sh copies into place on
  # every real install, yet nothing else in CI ever parses it — so a YAML /
  # interpolation / schema error (or a security key applied to only one of the
  # two hand-maintained files, like the dns CAP_DAC_OVERRIDE fix) ships unnoticed.
  # `config -q` resolves and validates both files.
  validate-compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config -q
      - name: Validate prod compose
        run: docker compose -f deploy/docker-compose.prod.yml config -q

  # ── 9. End-to-end smoke (compose up + core path) ──────────────────────
  # Builds and RUNS the whole stack, then exercises the core path: service
  # health, proxy egress, live blacklist blocking, the Squid→backend log
  # pipeline, and the audit log. This is the check that would have caught the
  # fresh-deploy breakage that the build-only jobs above let through.
  e2e:
    name: E2E (compose up + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose up + core smoke
        run: bash tests/ci-e2e.sh

  # ── 10. End-to-end UI/API (Playwright) ────────────────────────────────
  # Runs the maintained Playwright suite (tests/e2e/selfhoster.spec.ts) against
  # the test stack (backend + web + mock-lists) via docker-compose.test.yml.
  # The suite is green (59/59); 1 retry tolerates the occasional flake from the
  # serial / shared-DB design. It is a required status check on main.
  e2e-ui:
    name: E2E UI (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Playwright e2e (test compose)
        env:
          TEST_USERNAME: testadmin
          TEST_PASSWORD: TestP@ss123!
        run: |
          docker compose -f docker-compose.test.yml up --build \
            --abort-on-container-exit --exit-code-from test-runner
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ── 11. Adversarial data-plane block-matrix (proxy + WAF/ICAP) ────────────
  # Drives attacker traffic THROUGH the real forward proxy + WAF/ICAP in an
  # isolated sandbox and gates on false negatives/positives (issue #200, Phase 1).
  # run.sh prints the block-matrix + FP/FN report to the job log and tears the
  # stack down on exit; a hard FN>0 or FP>0 fails the job. It is a required
  # status check on main (ruleset "main").
  adversarial:
    name: Adversarial block-matrix (proxy + WAF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block-matrix through proxy + WAF/ICAP
        run: bash tests/adversarial/run.sh

  # ── 11b. Go vulnerabilities in the toolchain the images ship ──────────
  # setup-go serves the latest patch release, so the scan above answers "is
  # this source vulnerable on a current Go". The images are built by the
  # golang builder pinned by digest in the Dockerfiles, which can lag: v3.14.1
  # shipped go1.27.1 binaries while CI was on a newer patch. This runs
  # govulncheck INSIDE that pinned builder, so the stdlib it reports is the one
  # in the published binaries. Not a required check (a new stdlib advisory is
  # fixed by a digest bump, not by the pull request it would block); it fails
  # the nightly, which opens an issue.
  govulncheck-image-toolchain:
    name: Go vulnerabilities (image toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: govulncheck in the pinned golang builder
        run: |
          set -euo pipefail
          img=$(sed -n 's/^FROM \(golang:[^ ]*\) AS builder$/\1/p' backend-go/Dockerfile)
          [ -n "$img" ] && [ "$img" = "$(sed -n 's/^FROM \(golang:[^ ]*\) AS builder$/\1/p' waf-go/Dockerfile)" ] \
            || { echo "::error::backend-go and waf-go must build with the same pinned golang image"; exit 1; }
          echo "builder: $img"
          docker run --rm -v "$PWD:/src:ro" -e GOCACHE=/tmp/gocache -e GOPATH=/tmp/gopath "$img" sh -euc '
            go version
            go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
            for m in backend-go waf-go; do echo "── $m"; (cd /src/$m && /tmp/gopath/bin/govulncheck ./...); done'

  # ── 12. Nightly failure report ───────────────────────────────────────
  # The scheduled run is the only CI that sees main after a Dependabot
  # auto-merge (see the schedule comment above), and it failed every night from
  # 2026-10-02 to 2026-10-24 with nothing to say so: GitHub mails only whoever
  # last edited the cron, if their settings allow it. A red nightly now opens
  # one issue, or comments on the one already open, so it is seen.
  nightly-alert:
    name: Report a failed nightly
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [build-ui, version-sync, build-backend, build-waf, test-backend, test-waf, lint-go, lint-shell,
            lint-python, test-python, test-restore, test-squid-config, observability, security-scan, licences, trivy-scan,
            docker-build, check-urls, validate-compose, e2e, e2e-ui, adversarial, govulncheck-image-toolchain]
    runs-on: ubuntu-latest
    permissions:
      actions: read # gh run view: which jobs failed
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create nightly-failure --color B60205 \
            --description "The scheduled CI run on main failed" --force >/dev/null
          failed=$(gh run view "${{ github.run_id }}" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          body="Scheduled CI on main failed at ${SHA}.

          Failed jobs: ${failed:-unknown}

          Run: ${RUN_URL}"
          existing=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Nightly CI on main is failing" --label nightly-failure --body "$body"
          fi
