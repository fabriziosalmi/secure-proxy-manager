name: OpenSSF Scorecard

# Supply-chain posture checks (pinned dependencies, token permissions, branch
# protection, signed releases, ...) reported to the repository's code scanning
# alerts. Results are not published to the public OpenSSF API: that and the
# README badge are a separate decision (publish_results).
on:
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
