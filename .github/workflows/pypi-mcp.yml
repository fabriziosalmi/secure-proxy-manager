name: Publish spm-mcp to PyPI

# PyPI Trusted Publishing: PyPI accepts an upload only from this workflow, in
# this repository, in the "pypi" environment, authenticated with a short-lived
# OIDC token. No API token exists anywhere to leak or rotate. The upload also
# carries PEP 740 attestations, generated by the publish action.
#
# A release of the MCP server is a tag mcp-vX.Y.Z, matching the version in
# mcp/pyproject.toml. Tags matching mcp-v* can only be created by an admin
# (ruleset "release tags"), and the "pypi" environment waits for an approval.
on:
  push:
    tags: ['mcp-v*']

permissions:
  contents: read

jobs:
  # Built and checked without any publishing credential: the build runs the
  # project's build backend, and nothing it does can reach the OIDC token.
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/mcp-v}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tags are mcp-vX.Y.Z, got ${GITHUB_REF#refs/tags/}"; exit 1; }
          pkg=$(sed -nE 's/^version = "([^"]+)"$/\1/p' mcp/pyproject.toml)
          mod=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' mcp/spm_mcp/__init__.py)
          [ "$tag" = "$pkg" ] && [ "$tag" = "$mod" ] \
            || { echo "::error::tag $tag, pyproject $pkg, __version__ $mod must agree"; exit 1; }

      - name: Build sdist and wheel
        run: pipx run build==1.3.0 --outdir dist mcp

      - name: twine check
        run: pipx run twine==7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spm-mcp/
    permissions:
      id-token: write # the OIDC token PyPI's Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
