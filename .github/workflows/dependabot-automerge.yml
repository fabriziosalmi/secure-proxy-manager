name: Dependabot auto-merge

# Turns on GitHub auto-merge for Dependabot pull requests that only bump patch
# or minor versions. Auto-merge waits for every required status check of the
# branch protection, so nothing merges unless CI is green. Major bumps, and
# grouped updates that contain one, stay manual: fetch-metadata reports the
# highest semver change in the pull request.
#
# `pull_request`, not `pull_request_target`: this job never checks out the pull
# request's code, and on Dependabot events the token is read-only unless the
# permissions below raise it.
on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'fabriziosalmi/secure-proxy-manager'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge (patch and minor only)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
