name: Dependabot nudge

# Keeps the auto-merge queue moving. With "require branches to be up to date",
# a Dependabot pull request that falls behind main waits forever: Dependabot
# rebases on conflicts, not on "behind", and a branch update pushed with the
# GITHUB_TOKEN would not start the required checks again. So this job asks
# Dependabot itself to rebase: its push does start CI.
#
# One pull request per run, like a merge queue: the oldest one that has
# auto-merge on, is behind, has every check green, and has not been touched in
# the last 30 minutes (so a rebase already in progress is not asked twice).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be done"
        type: boolean
        default: false

permissions: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    if: github.repository == 'fabriziosalmi/secure-proxy-manager'
    permissions:
      pull-requests: write
    steps:
      - name: Ask Dependabot to rebase the next queued pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -u
          cutoff=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          next=""
          for n in $(gh pr list --repo "$REPO" --author app/dependabot --state open --limit 100 \
                       --json number,autoMergeRequest,updatedAt \
                       --jq "sort_by(.number) | .[] | select(.autoMergeRequest != null and .updatedAt < \"$cutoff\") | .number"); do
            state=$(gh pr view "$n" --repo "$REPO" --json mergeStateStatus,statusCheckRollup \
              --jq '"\(.mergeStateStatus) " + ([.statusCheckRollup[]? | (.conclusion // .state // "") | select(. != "SUCCESS" and . != "SKIPPED" and . != "NEUTRAL")] | length | tostring)')
            echo "#$n: $state"
            if [ "$state" = "BEHIND 0" ]; then next="$n"; break; fi
          done
          if [ -z "$next" ]; then echo "Nothing to nudge."; exit 0; fi
          if [ "${DRY_RUN:-false}" = "true" ]; then echo "Would ask Dependabot to rebase #$next"; exit 0; fi
          echo "Asking Dependabot to rebase #$next"
          gh pr comment "$next" --repo "$REPO" --body "@dependabot rebase"
