name: Multi-Arch Build & Push

# Release pipeline. A v* tag builds every image for amd64 and arm64, pushes it
# by digest only and scans what was pushed (build-scan). Only when every image
# has passed its scan, and the spm binaries are built and signed, does publish
# run: for each image it checks that the scanned digest resolves, signs it on
# GHCR, and only then gives it its GHCR tags (version, latest), so on GHCR a
# signing failure leaves the image untagged. The Docker Hub mirror comes after:
# copying the digest there creates its Hub tags, and the Hub copy is signed
# once it exists, so on Docker Hub the tags are in place before the signature.
# A red scan on any image leaves every image of the run untagged: nothing an
# installer pulls points at a digest of a partial release. v3.26.0 tagged dns
# because each image used to tag itself right after its own scan.
#
# A publish leg can still fail on its own (registry error, signing after its
# retries). Re-run the failed jobs of the same run (gh run rerun RUN_ID
# --failed): build-scan's digests are kept as artifacts, and signing and
# tagging by digest are idempotent, so the rerun finishes the release with the
# digests that were scanned and no new tag. Do it before a newer release is
# tagged, or the rerun moves :latest back. Each digest artifact carries the
# run attempt that wrote it, and publish reads, for each image, the one of the
# newest attempt: a full rerun publishes the digests it rebuilt and scanned,
# and a rerun of the failed jobs only still finds the earlier attempt's.
#
# workflow_dispatch is a DRY RUN of the same path on the selected ref: build,
# push by digest, scan, and in publish check that each digest resolves; then
# install cosign, log in to Docker Hub when its credentials exist, verify the
# current release's :latest on GHCR and Docker Hub with that cosign, and stop.
# Nothing is signed or tagged (tests/shell/release_dry_run_test.sh holds every
# sign, tag and mirror step to a release tag). It used to tag and push :latest from any
# ref, unsigned, because signing ran only for tags; the production compose
# pulled :latest, so any dispatch replaced what installers received.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  # Gates that do not need an image: the tag names the version the code
  # declares, and the Go the images are built with has no reachable known
  # vulnerability (govulncheck inside the pinned builder, as in CI).
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [ "$RELEASE" = true ]; then
            version="${GITHUB_REF#refs/tags/}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::release tags are vX.Y.Z, got '$version'"; exit 1; }
            code="v$(sed -nE 's/.*AppVersion = "([^"]+)".*/\1/p' backend-go/internal/config/version.go | head -1)"
            [ "$version" = "$code" ] \
              || { echo "::error::tag $version does not match AppVersion $code"; exit 1; }
          else
            version="dry-run"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE version=$version"

      - name: Version declarations agree
        run: bash scripts/check-version-sync.sh

      - name: govulncheck in the pinned golang builder
        run: |
          set -euo pipefail
          img=$(sed -n 's/^FROM \(golang:[^ ]*\) AS builder$/\1/p' backend-go/Dockerfile)
          [ -n "$img" ] && [ "$img" = "$(sed -n 's/^FROM \(golang:[^ ]*\) AS builder$/\1/p' waf-go/Dockerfile)" ] \
            || { echo "::error::backend-go and waf-go must build with the same pinned golang image"; exit 1; }
          docker run --rm -v "$PWD:/src:ro" -e GOCACHE=/tmp/gocache -e GOPATH=/tmp/gopath "$img" sh -euc '
            go version
            go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
            for m in backend-go waf-go; do echo "── $m"; (cd /src/$m && /tmp/gopath/bin/govulncheck ./...); done'

  # The spm command for every platform, built in the pinned golang image as
  # the backend is, with SHA256SUMS. On a release the checksums are signed
  # keyless into a sigstore bundle that verifies against this workflow's tag
  # identity; a dry run builds and sums, and signs nothing. The files leave as
  # a workflow artifact that the release attaches: this workflow never writes
  # to the repository.
  cli-assets:
    name: spm binaries
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for cosign keyless signing of SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build spm for every platform
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/build-cli-assets.sh "$VERSION" dist/spm "${GITHUB_SHA::12}"
      # Installed on a dry run too, so a broken installer shows before a tag.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Run the installed cosign (dry run)
        if: ${{ env.RELEASE != 'true' }}
        run: cosign version
      - name: Sign SHA256SUMS (keyless)
        if: ${{ env.RELEASE == 'true' }}
        run: bash scripts/cosign-sign-blob.sh dist/spm/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spm-${{ needs.preflight.outputs.version }}
          path: dist/spm/
          if-no-files-found: error
          retention-days: 90

  # Builds, pushes by digest and scans each image. It tags nothing and signs
  # nothing: a digest that leaves this job is named only by its sha256. Each
  # leg hands its digest to publish as the artifact digest-<image>-<attempt>.
  # fail-fast is off so that one red scan does not cancel the other legs: the
  # run reports every image's scan, and a rerun of the failed leg alone can
  # complete it.
  build-scan:
    name: Build and scan ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push by digest to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: .
            dockerfile: ./ui/Dockerfile
          - image: backend
            context: ./backend-go
            dockerfile: ./backend-go/Dockerfile
          - image: waf
            context: ./waf-go
            dockerfile: ./waf-go/Dockerfile
          - image: proxy
            context: ./proxy
            dockerfile: ./proxy/Dockerfile
          - image: dns
            context: ./dns
            dockerfile: ./dns/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, with no tag: until every scan of the run has passed,
      # nothing names this image. No build cache: the GHA cache can be written
      # by any workflow run on the repository, and a poisoned layer would
      # otherwise be scanned, tagged and signed as the release.
      #
      # APT_REFRESH busts the proxy image's apt layer so it never reinstalls an
      # unpatched squid (that Dockerfile also fails closed below its CVE floor);
      # images whose Dockerfile does not declare it ignore it. GIT_SHA is what
      # /api/health reports as the commit; without it the binaries embed the
      # ARG default, "unknown" (SECURE-BLD-01).
      - name: Build and push ${{ matrix.image }} by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          build-args: |
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            GIT_SHA=${{ github.sha }}
          # SBOM and SLSA build provenance attestations on each image.
          sbom: true
          provenance: mode=max

      - name: Install Trivy
        run: |
          VER=0.69.3
          SHA256=1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          echo "${SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      # The scan CI never ran: its image scan skips this project's own images
      # (they are built, not pulled), and v3.14.1 shipped Go and Alpine
      # advisories that had fixes. This scans the exact digest just pushed, both
      # architectures, with no ignore file: the exceptions in .trivyignore.yaml
      # are for third-party images and do not apply to what this project ships.
      - name: Scan the pushed image (amd64 and arm64)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "── ${IMAGE}@${DIGEST} ${platform}"
            trivy image --platform "$platform" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress "${IMAGE}@${DIGEST}"
          done

      # Reached only when the scan above passed: the artifact exists only for
      # a scanned digest. Its name carries the run attempt, so no attempt
      # overwrites another's and publish can tell which is newest: a run keeps
      # every attempt's artifacts, and the download keeps one per name by
      # artifact id, which is not an attempt order.
      - name: Write the scanned digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::build-push-action returned '$DIGEST', not a sha256 digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest/digest"
          echo "${GITHUB_REF}: ${IMAGE}@${DIGEST} built and scanned; not tagged, not signed."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digest/digest
          if-no-files-found: error
          retention-days: 90

  # Runs only when every build-scan leg and cli-assets succeeded: needs makes
  # one red scan skip every publish leg, so no image of the run is tagged.
  # For each image: check that the scanned digest resolves to an index with
  # both platforms, sign it, then tag it, then mirror and sign the mirror. On
  # GHCR the signature is in place before :vX.Y.Z or :latest names the
  # digest, so a signing failure leaves the image untagged rather than tagged
  # and unsigned. On Docker Hub the digest exists only once the mirror step
  # has copied it with its tags, so the Hub signature follows the Hub tags: a
  # failure signing the mirror leaves the Hub tags in place, unsigned, until a
  # rerun signs them.
  # On a dry run only the checks run, and the current release is verified.
  publish:
    name: Publish ${{ matrix.image }}
    needs: [preflight, build-scan, cli-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        image: [web, backend, waf, proxy, dns]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.image }}
      IMG: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every build-scan leg's digest of every attempt of this run, one
      # directory per artifact (digests/digest-<image>-<attempt>/digest).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      # The two matrices list the images separately. If build-scan scanned an
      # image this matrix does not publish (or the reverse), every publish leg
      # stops here, so a release never goes out without one of its images.
      # For this image the artifact of the newest attempt is read
      # (scripts/select-scanned-digest.sh, tests/shell/release_digest_test.sh).
      - name: Read the scanned digest
        id: digest
        env:
          DIGESTS: ${{ runner.temp }}/digests
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          digest=$(bash scripts/select-scanned-digest.sh "$DIGESTS" "$IMG" "$JOB_TOTAL")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${IMG}: ${IMAGE}@${digest}"

      # `secrets` cannot be used in `if:` conditions, so detect the Docker Hub
      # credentials here (secrets ARE allowed in a step's env/run) and gate the
      # mirror steps on this output. Absent creds → GHCR-only, nothing breaks.
      - name: Detect Docker Hub credentials
        id: dh
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is where people search for images (GHCR has little organic
      # discovery). Mirror there too, but only when the credentials exist, so
      # the release still works with just GHCR if they are not configured.
      # Logged in to on a dry run too: the dry run verifies the mirror below.
      - name: Login to Docker Hub
        if: ${{ steps.dh.outputs.enabled == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The digest came through an artifact: before anything names it, check
      # that it is in this image's repository and is the two-platform index
      # build-scan pushed and scanned.
      - name: Check the scanned digest resolves
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -e '[.manifests[]?.platform | select(. != null) | "\(.os)/\(.architecture)"]
                     | (index("linux/amd64") != null) and (index("linux/arm64") != null)' >/dev/null \
            || { echo "::error::${IMAGE}@${DIGEST} is not an index with linux/amd64 and linux/arm64"; exit 1; }

      # Installed on a dry run too, and used there to verify the current
      # release: a broken cosign-installer or Docker Hub login shows here,
      # not first on a tag, where a fix needs another release.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify the current release with the installed cosign (dry run)
        if: ${{ env.RELEASE != 'true' }}
        env:
          DH_ENABLED: ${{ steps.dh.outputs.enabled }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          bash scripts/cosign-verify.sh "${IMAGE}:latest"
          if [ "$DH_ENABLED" = true ]; then
            bash scripts/cosign-verify.sh "docker.io/${DH_USER}/secure-proxy-manager:${IMG}-latest"
          fi

      - name: Stop here on a dry run
        if: ${{ env.RELEASE != 'true' }}
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          echo "Dry run ${GITHUB_REF}: ${IMAGE}@${DIGEST} resolves; not signed, not tagged."

      # Keyless (OIDC) signature via cosign, so consumers can verify the image
      # against this repository's release workflow identity. Signing is
      # required: if it fails the job fails, before any tag names the digest.
      # scripts/cosign-sign.sh retries a transient failure (v3.18.1 lost its
      # Docker Hub signature to a Rekor 409 on cosign's own retry) and then
      # verifies the signature is there.
      - name: Sign the scanned digest (keyless)
        if: ${{ env.RELEASE == 'true' }}
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: bash scripts/cosign-sign.sh "${IMAGE}@${DIGEST}"

      - name: Tag the scanned and signed digest
        if: ${{ env.RELEASE == 'true' }}
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

      # Docker Hub uses a SINGLE repo (secure-proxy-manager) with the component
      # in the tag (…:proxy-<version>, …:dns-latest, …). The manifest is copied
      # as is, so the digest, and the signature below, are the same.
      - name: Mirror to Docker Hub
        if: ${{ env.RELEASE == 'true' && steps.dh.outputs.enabled == 'true' }}
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "docker.io/${DH_USER}/secure-proxy-manager:${IMG}-${VERSION}" \
            -t "docker.io/${DH_USER}/secure-proxy-manager:${IMG}-latest" \
            "${IMAGE}@${DIGEST}"
      - name: Sign the Docker Hub image (keyless)
        if: ${{ env.RELEASE == 'true' && steps.dh.outputs.enabled == 'true' }}
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: bash scripts/cosign-sign.sh "docker.io/${DH_USER}/secure-proxy-manager@${DIGEST}"
