name: Multi-Arch Build & Push

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for cosign keyless signing
    strategy:
      matrix:
        include:
          - image: web
            context: .
            dockerfile: ./ui/Dockerfile
          - image: backend
            context: ./backend-go
            dockerfile: ./backend-go/Dockerfile
          - image: waf
            context: ./waf-go
            dockerfile: ./waf-go/Dockerfile
          - image: proxy
            context: ./proxy
            dockerfile: ./proxy/Dockerfile
          - image: dns
            context: ./dns
            dockerfile: ./dns/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `secrets` cannot be used in `if:` conditions, so detect the Docker Hub
      # credentials here (secrets ARE allowed in a step's env/run) and gate the
      # mirror steps on this output. Absent creds → GHCR-only, nothing breaks.
      - name: Detect Docker Hub credentials
        id: dh
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is where people search for images (GHCR has little organic
      # discovery). Mirror there too — but only when the credentials exist, so
      # the release still works with just GHCR if they are not configured.
      - name: Login to Docker Hub
        if: ${{ steps.dh.outputs.enabled == 'true' }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      # Tag list. GHCR keeps a package per component (ghcr.io/…/…-<component>).
      # Docker Hub uses a SINGLE repo (secure-proxy-manager) with the component in
      # the tag (…:proxy-<version>, …:dns-latest, …) — added only when
      # DOCKERHUB_USERNAME is set.
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMG: ${{ matrix.image }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_PREFIX}-${IMG}:${VERSION}"
            echo "${IMAGE_PREFIX}-${IMG}:latest"
            if [ -n "$DH_USER" ]; then
              echo "docker.io/${DH_USER}/secure-proxy-manager:${IMG}-${VERSION}"
              echo "docker.io/${DH_USER}/secure-proxy-manager:${IMG}-latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Busts the proxy image's apt layer every run so a cached layer can
          # never reinstall an unpatched squid (the proxy Dockerfile also fails
          # closed if squid is older than its CVE floor). Ignored by images whose
          # Dockerfile does not declare APT_REFRESH.
          build-args: |
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Attach an SBOM and SLSA build provenance attestation to each image so
          # consumers can audit contents and verify the build origin.
          sbom: true
          provenance: mode=max

      # Keyless (OIDC) signature via cosign, so consumers can verify the image
      # provenance against this repo's identity. Signing is required — the
      # workflow fails if cosign cannot sign, preventing an unsigned image
      # from being published.
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published image (keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Sign the Docker Hub image (keyless)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.dh.outputs.enabled == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          # Single repo; the digest identifies this component's manifest.
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/secure-proxy-manager
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
