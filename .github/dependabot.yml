version: 2

# Grouped updates cover minor and patch only. A major lands as its own pull
# request instead of riding along with twenty compatible bumps.
#
# The ui-dependencies group showed why. With `patterns: ["*"]` and no split it
# collected typescript 5.9 -> 7.0, tailwindcss 3.4 -> 4.3, jsdom 29 -> 30 and
# @types/node 24 -> 26 into one pull request, which failed the TypeScript build,
# the Docker build and both E2E jobs. Nothing in it could be merged, so the
# harmless minors behind it were stuck too, from 31 August until this was found.
#
# The split applies to npm and gomod, where a major changes source-level
# compatibility (a Go major changes the import path outright). Docker and
# github-actions stay grouped: a major there is a tag change that CI validates
# end to end, and splitting it would only add noise.
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      ui-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/backend-go"
    schedule:
      interval: "weekly"
    groups:
      backend-go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/waf-go"
    schedule:
      interval: "weekly"
    groups:
      waf-go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # One entry for every Dockerfile in the tree, using `directories` (plural,
  # glob-capable) rather than nine separate `directory` entries. The nine were
  # producing nine independent pull requests, and with "require branches to be
  # up to date" each merge put the other eight behind: thirteen dependency pull
  # requests were open at once, the oldest three weeks old, none of them able
  # to merge. Grouping them collapses a base-image sweep into one.
  #
  # Two of the old entries watched directories with no Dockerfile in them —
  # "/" and "/deploy", which hold compose files. Dependabot's docker ecosystem
  # reads Dockerfiles and Kubernetes YAML only, so "/deploy" failed every week
  # with "No Dockerfiles nor Kubernetes YAML found in /deploy" and "/" produced
  # nothing. Both are dropped.
  #
  # Two real Dockerfiles had no entry at all and were therefore proposed by
  # nothing: /mcp and /tests/adversarial/attacker. Same shape as SECURE-DEP-02.
  #
  # NOT covered here, and deliberately: the images pinned in the compose files
  # (grafana, prometheus, k6, nginx, tailscale). Dependabot cannot see them in
  # this ecosystem and Trivy's filesystem scan does not pull them, so they are
  # currently watched by nothing. Tracked separately rather than papered over.
  - package-ecosystem: "docker"
    directories:
      - "/backend-go"
      - "/waf-go"
      - "/ui"
      - "/dns"
      - "/proxy"
      - "/mcp"
      - "/overlay/tailscale"
      - "/tests/e2e"
      - "/tests/adversarial/attacker"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep the SHA-pinned GitHub Actions (ci.yml, multi-arch.yml, docs.yml)
  # patched — pinning to a digest means we don't get upstream fixes otherwise.
  # SECURE-DEP-02: mcp/ had no ecosystem entry at all, so its Python
  # dependencies were proposed by nothing and scanned by nothing — osv-scanner
  # reads lockfiles and this component has none.
  - package-ecosystem: "pip"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
