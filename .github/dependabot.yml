version: 2

# Grouped updates cover minor and patch only. A major lands as its own pull
# request instead of riding along with twenty compatible bumps.
#
# The ui-dependencies group showed why. With `patterns: ["*"]` and no split it
# collected typescript 5.9 -> 7.0, tailwindcss 3.4 -> 4.3, jsdom 29 -> 30 and
# @types/node 24 -> 26 into one pull request, which failed the TypeScript build,
# the Docker build and both E2E jobs. Nothing in it could be merged, so the
# harmless minors behind it were stuck too, from 31 August until this was found.
#
# The split applies to npm and gomod, where a major changes source-level
# compatibility (a Go major changes the import path outright). Docker and
# github-actions stay grouped: a major there is a tag change that CI validates
# end to end, and splitting it would only add noise.
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      ui-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/backend-go"
    schedule:
      interval: "weekly"
    groups:
      backend-go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/waf-go"
    schedule:
      interval: "weekly"
    groups:
      waf-go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  # Per-directory Docker entries so Dependabot bumps digest-pinned base images
  # in each Dockerfile independently (a root "/" entry only watches that one file).
  - package-ecosystem: "docker"
    directory: "/backend-go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/waf-go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/ui"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/dns"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/proxy"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/overlay/tailscale"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep the SHA-pinned GitHub Actions (ci.yml, multi-arch.yml, docs.yml)
  # patched — pinning to a digest means we don't get upstream fixes otherwise.
  # SECURE-DEP-02: mcp/ had no ecosystem entry at all, so its Python
  # dependencies were proposed by nothing and scanned by nothing — osv-scanner
  # reads lockfiles and this component has none.
  - package-ecosystem: "pip"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
