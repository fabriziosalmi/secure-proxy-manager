version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      ui-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/backend-go"
    schedule:
      interval: "weekly"
    groups:
      backend-go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/waf-go"
    schedule:
      interval: "weekly"
    groups:
      waf-go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  # Per-directory Docker entries so Dependabot bumps digest-pinned base images
  # in each Dockerfile independently (a root "/" entry only watches that one file).
  - package-ecosystem: "docker"
    directory: "/backend-go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/waf-go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/ui"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/dns"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/proxy"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/overlay/tailscale"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-dependencies:
        patterns:
          - "*"

  # Keep the SHA-pinned GitHub Actions (ci.yml, multi-arch.yml, docs.yml)
  # patched — pinning to a digest means we don't get upstream fixes otherwise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
